<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NMLE Practice Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500&family=Vazirmatn:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column, like a paper answer sheet. Setup screen, then a scrolling sheet of questions with OMR-style bubbles. */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --ink:#14212A; --muted:#566772; --line:#D2DBE1; --soft:#E3E9ED;
  --accent:#0A6C77; --on-accent:#FFFFFF;
  --good:#17794A; --good-bg:#E1F3E8; --bad:#B2362D; --bad-bg:#FAE6E3; --warn:#7D5200; --warn-bg:#FBF0D9;
  --f-ui:"Archivo","Vazirmatn",system-ui,sans-serif;
  --f-fa:"Vazirmatn","Archivo",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F171C; --surface:#172229; --ink:#E6EEF2; --muted:#93A4AF; --line:#2B3B45; --soft:#1F2D36;
    --accent:#4DBFCB; --on-accent:#06262A;
    --good:#5CD18F; --good-bg:#13301F; --bad:#F2918A; --bad-bg:#3A1B19; --warn:#F0C26A; --warn-bg:#33270E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F171C; --surface:#172229; --ink:#E6EEF2; --muted:#93A4AF; --line:#2B3B45; --soft:#1F2D36;
  --accent:#4DBFCB; --on-accent:#06262A;
  --good:#5CD18F; --good-bg:#13301F; --bad:#F2918A; --bad-bg:#3A1B19; --warn:#F0C26A; --warn-bg:#33270E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:46rem;margin-inline:auto;padding-inline:16px;padding-block:22px 72px}
h1,h2,p{margin:0}
button{font:inherit;color:inherit}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Setup */
.hero{display:flex;flex-direction:column;gap:10px;padding-block:8px 20px}
.hero h1{font-size:clamp(30px,8vw,44px);line-height:1.05;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.hero p{color:var(--muted);max-width:34rem}
.motif{display:flex;gap:8px;margin-block:2px 4px}
.motif .bub{width:30px;height:30px;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field>.lbl{font-size:13px;font-weight:700}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:10px}
.mode{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:2px}
.mode b{font-size:15px}
.mode span{font-size:13px;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 1px var(--accent) inset}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:baseline;gap:6px;font-size:13px}
.chip small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.75}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:18px}
select{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 16px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn.big{padding:13px 22px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.link{background:none;border:0;padding:2px 4px;cursor:pointer;color:var(--muted);text-decoration:underline;font-size:12px}
.resume{background:var(--warn-bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.resume p{min-width:0}
.fine{font-size:12.5px;color:var(--muted);margin-top:16px;max-width:38rem}

/* Sticky exam bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding:10px 16px 0;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.prog{display:flex;align-items:baseline;gap:6px;min-width:0;white-space:nowrap}
.prog b{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.prog span{font-size:13px;color:var(--muted)}
.clock{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.clock.low{color:var(--bad)}
.track{height:4px;background:var(--soft);margin-top:10px;margin-inline:-16px}
.track i{display:block;height:100%;width:0;background:var(--accent)}
.ask{padding-block:12px 14px;display:flex;flex-direction:column;gap:10px}
.ask[hidden]{display:none}

/* Questions */
.list{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:96px}
.qh{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.qno{font-family:var(--f-mono);font-size:15px;font-weight:500;background:var(--ink);color:var(--bg);border-radius:6px;padding:1px 8px;min-width:2.2em;text-align:center}
.tag{font-size:12px;color:var(--muted)}
.src{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-inline-start:auto}
.badge{font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px}
.badge.right{background:var(--good-bg);color:var(--good)}
.badge.wrong{background:var(--bad-bg);color:var(--bad)}
.badge.skip{background:var(--soft);color:var(--muted)}
.stem{font-family:var(--f-fa);font-size:17px;line-height:1.9;font-weight:500;text-align:right}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{position:relative;display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px;border:1.5px solid transparent;cursor:pointer;font-family:var(--f-fa);font-size:16px;line-height:1.7}
.opt:hover{background:var(--bg)}
.opt input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.opt .txt{min-width:0;overflow-wrap:anywhere}
.opt .txt[dir="ltr"]{text-align:left}
.opt .txt[dir="rtl"]{text-align:right}
.bub{flex:none;width:34px;height:34px;border-radius:50%;border:1.8px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-fa);font-size:15px;font-weight:700;color:var(--muted);background:transparent;transition:background .12s,color .12s,border-color .12s}
.opt.sel .bub{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.opt.sel{background:var(--soft)}
.opt:has(input:focus-visible) .bub{outline:3px solid var(--accent);outline-offset:2px}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.right .bub{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.locked{cursor:default}
.opt.locked:hover{background:inherit}
.opt.right:hover{background:var(--good-bg)}.opt.wrong:hover{background:var(--bad-bg)}
.note{font-size:13px;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px}
.note b{font-weight:700}
.end{display:flex;flex-direction:column;gap:8px;align-items:flex-start;margin-top:18px}
.end p{font-size:13px;color:var(--muted)}

/* Results */
.result{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px;margin-top:6px}
.score{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px}
.score .big{font-family:var(--f-mono);font-size:56px;line-height:1;font-weight:500}
.score .of{font-family:var(--f-mono);font-size:20px;color:var(--muted)}
.score .pct{font-size:20px;font-weight:800;margin-inline-start:auto}
.sub{color:var(--muted)}
.subj{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto;gap:8px 12px;align-items:center;font-size:13px}
.subj .nm{min-width:0;overflow-wrap:anywhere}
.subj .tk{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.subj .tk i{display:block;height:100%;background:var(--accent)}
.subj .tk i.low{background:var(--bad)}
.subj .ct{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:end}
.hint{font-size:13px;color:var(--muted)}
.nameIn{width:100%;min-height:44px;padding:0 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.nameErr{font-size:13px;color:var(--bad);min-height:0}
.list[data-filter="missed"] .q[data-res="right"]{display:none}

@media (max-width:480px){
  .stem{font-size:16px}
  .opt{font-size:15.5px;gap:10px;padding:7px 6px}
  .panel,.result{padding:16px}
  .score .big{font-size:46px}
  .src{margin-inline-start:0}
}
@media (prefers-reduced-motion:reduce){.bub{transition:none}}
</style>

var Q=RAW.map(function(r){return {n:r[0],s:r[1],t:r[2],o:r[3],a:r[4]-1,note:r[5]||""};});
var byN={};Q.forEach(function(q){byN[q.n]=q;});
var NOTES=Q.filter(function(q){return q.note;}).length;

var app=document.getElementById("app");
var S=null, timer=null;
var cfg={mode:"exam",subs:Object.keys(SUBJ),count:"all",shuffle:true,limit:0};

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fa(n){return String(n).replace(/\d/g,function(d){return "۰۱۲۳۴۵۶۷۸۹"[d];});}
function hasFa(t){return /[؀-ۿ]/.test(t);}
function pad(n){return n<10?"0"+n:""+n;}
function fmt(sec){sec=Math.max(0,sec);var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+":"+pad(m):pad(m))+":"+pad(s);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function reduced(){return window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;}

function load(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function save(){try{if(S)localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function wipe(){try{localStorage.removeItem(KEY);}catch(e){}}

function answered(){return Object.keys(S.ans).length;}
function stats(){
  var r=0,w=0,k=0,per={};
  S.ids.forEach(function(n){
    var q=byN[n],a=S.ans[n],p=per[q.s]||(per[q.s]={r:0,t:0});
    p.t++;
    if(a==null)k++;else if(a===q.a){r++;p.r++;}else w++;
  });
  return {r:r,w:w,k:k,per:per,total:S.ids.length};
}

/* ---------- Setup ---------- */
function availCount(){return Q.filter(function(q){return cfg.subs.indexOf(q.s)>-1;}).length;}

  var counts={};Q.forEach(function(q){counts[q.s]=(counts[q.s]||0)+1;});

    if(S.done){
      var st=stats();
      resume='<div class="resume"><p><b>Last result:</b> '+st.r+' of '+st.total+' correct ('+Math.round(st.r/st.total*100)+'%).</p><div class="row"><button class="btn" data-act="reopen">Review answers</button></div></div>';
    }else{
      resume='<div class="resume"><p><b>Exam in progress:</b> '+answered()+' of '+S.ids.length+' answered.</p><div class="row"><button class="btn primary" data-act="resume">Resume</button><button class="btn ghost" data-act="discard">Discard</button></div></div>';
    }
  }
  var counts2=["all","25","50","100"].map(function(c){
    var num=c==="all"?avail:+c;
    var dis=c!=="all"&&num>avail;

  var lim=[0,30,60,90,120,150].map(function(m){return '<option value="'+m+'"'+(cfg.limit===m?' selected':'')+'>'+(m?m+" minutes":"No time limit")+'</option>';}).join("");
  return ''+
  '<header class="hero">'+
    '<p class="eyebrow">12th National Medical Licensing Exam</p>'+
    '<div class="motif" aria-hidden="true"><span class="bub">'+fa(1)+'</span><span class="bub">'+fa(2)+'</span><span class="bub" style="background:var(--ink);border-color:var(--ink);color:var(--bg)">'+fa(3)+'</span><span class="bub">'+fa(4)+'</span></div>'+
    '<h1>NMLE Practice Exam</h1>'+
    '<p>'+Q.length+' questions from your PDF across '+Object.keys(SUBJ).length+' subjects, scored against the answer key printed in it. Fill the bubbles, then check yourself.</p>'+
  '</header>'+
  resume+
  '<section class="panel" aria-label="Exam settings">'+
    '<div class="field"><label class="lbl" for="pname">Your name</label><input id="pname" class="nameIn" type="text" maxlength="40" autocomplete="name" placeholder="Write your full name" value="'+esc(NAME)+'" aria-describedby="nameerr"><span id="nameerr" class="nameErr" role="alert"></span></div>'+
    '<div class="field"><span class="lbl">Mode</span><div class="modes">'+
      '<button class="mode" data-mode="exam" aria-pressed="'+(cfg.mode==="exam")+'"><b>Exam</b><span>Answers stay hidden until you submit.</span></button>'+
      '<button class="mode" data-mode="practice" aria-pressed="'+(cfg.mode==="practice")+'"><b>Practice</b><span>Each answer is checked as soon as you pick it.</span></button>'+
    '</div></div>'+
    '<div class="field"><span class="lbl">Subjects</span><div class="chips">'+chips+'</div>'+
      '<div class="row"><button class="link" data-act="allsubs">Select all</button><button class="link" data-act="nosubs">Clear</button></div></div>'+
    '<div class="two">'+
      '<div class="field"><span class="lbl">Number of questions</span><div class="seg">'+counts2+'</div></div>'+
      '<div class="field"><span class="lbl">Question order</span><div class="seg"><button data-order="rand" aria-pressed="'+cfg.shuffle+'">Shuffled</button><button data-order="pdf" aria-pressed="'+(!cfg.shuffle)+'">PDF order</button></div></div>'+
    '</div>'+
    '<div class="field"><label class="lbl" for="limit">Time limit</label><div><select id="limit">'+lim+'</select></div></div>'+
    '<div class="row"><button class="btn primary big" data-act="start"'+(avail?'':' disabled')+'>Start '+(cfg.mode==="exam"?"exam":"practice")+'</button>'+(avail?'':'<span class="hint">Pick at least one subject.</span>')+'</div>'+
  '</section>'+
  '<p class="fine">Q137 and Q153 are left out because the PDF cuts them off. '+NOTES+' questions carry a «key check» note where the PDF key or wording looks doubtful; the answer used for scoring is always the one marked in the PDF.</p>';
}

function renderSetup(){
  clearInterval(timer);
  app.innerHTML=setupHTML();
}

/* ---------- Exam ---------- */
function revealed(n){return S.done||(S.cfg.mode==="practice"&&S.ans[n]!=null);}

function cardHTML(n,i){
  var q=byN[n],a=S.ans[n],rev=revealed(n);
  var res=a==null?"skip":(a===q.a?"right":"wrong");
  var badge="";
  if(rev)badge='<span class="badge '+res+'">'+(res==="right"?"Correct":res==="wrong"?"Wrong":"Skipped")+'</span>';
  var clear='';
  var opts=q.o.map(function(t,k){
    var cls="opt",mark=fa(k+1);
    if(rev){
      cls+=" locked";
      if(k===q.a){cls+=" right";mark="✓";}
      else if(k===a){cls+=" wrong";mark="✕";}
    }else if(k===a)cls+=" sel";
    var d=hasFa(t)?"rtl":"ltr";
    return '<label class="'+cls+'" dir="rtl"><input type="radio" name="q'+n+'" value="'+k+'"'+(k===a?' checked':'')+((rev||a!=null)?' disabled':'')+'><span class="bub" aria-hidden="true">'+mark+'</span><span class="txt" dir="'+d+'">'+esc(t)+'</span></label>';
  }).join("");
  var note=(rev&&q.note)?'<p class="note"><b>Key check.</b> '+esc(q.note)+'</p>':'';
  return '<article class="q" id="q'+n+'" data-n="'+n+'" data-res="'+(S.done?res:"")+'">'+
    '<div class="qh"><span class="qno">'+(i+1)+'</span><span class="tag">'+esc(SUBJ[q.s][0])+'</span>'+badge+clear+'<span class="src">PDF #'+n+'</span></div>'+
    '<p class="stem" dir="rtl" lang="fa">'+esc(q.t)+'</p>'+
    '<div class="opts" role="radiogroup" aria-label="Question '+(i+1)+' answers">'+opts+'</div>'+note+
  '</article>';
}

function barHTML(){
  return '<div class="bar" id="bar">'+
    '<div class="bar-row"><div class="prog"><b id="pc">0</b><span>/ '+S.ids.length+' answered</span></div>'+
    '<div class="clock mono" id="clock">00:00</div>'+
    '<button class="btn primary" data-act="ask">'+(S.cfg.mode==="exam"?"Submit":"Finish")+'</button></div>'+
    '<div class="track"><i id="fill"></i></div>'+
    '<div class="ask" id="ask" hidden><p id="askmsg"></p><div class="row"><button class="btn primary" data-act="submit">'+(S.cfg.mode==="exam"?"Submit now":"Finish now")+'</button><button class="btn" data-act="cancel">Keep going</button><button class="btn ghost" data-act="next">Go to first unanswered</button></div></div>'+
  '</div>';
}

function resultHTML(){
  var st=stats(),pct=Math.round(st.r/st.total*100);
  var rows=Object.keys(st.per).sort(function(a,b){return st.per[a].r/st.per[a].t-st.per[b].r/st.per[b].t;}).map(function(k){
    var p=st.per[k],pc=Math.round(p.r/p.t*100);
    return '<span class="nm">'+esc(SUBJ[k][0])+'</span><span class="tk"><i class="'+(pc<50?"low":"")+'" style="width:'+pc+'%"></i></span><span class="ct">'+p.r+'/'+p.t+'</span>';
  }).join("");
  var missed=st.w+st.k;
  var f=S.filter||"all";
  return '<section class="result" id="result">'+
    '<p class="eyebrow">'+(S.cfg.mode==="exam"?"Exam":"Practice")+' result · '+fmt(S.elapsed)+'</p>'+
    '<div class="score"><span class="big">'+st.r+'</span><span class="of">/ '+st.total+'</span><span class="pct">'+pct+'%</span></div>'+
    '<p class="sub">'+st.r+' correct · '+st.w+' wrong · '+st.k+' skipped</p>'+
    '<div class="subj" role="list" aria-label="Score by subject">'+rows+'</div>'+
    '<div class="row"><div class="seg"><button data-filter="all" aria-pressed="'+(f==="all")+'">All answers</button><button data-filter="missed" aria-pressed="'+(f==="missed")+'">Wrong and skipped ('+missed+')</button></div></div>'+
    '<div class="row"><button class="btn primary" data-act="retake"'+(missed?'':' disabled')+'>Retake the '+missed+' missed</button><button class="btn" data-act="newexam">New exam</button></div>'+
  '</section>';
}

function renderExam(){
  var list=S.ids.map(function(n,i){return cardHTML(n,i);}).join("");
  var end=S.done?'':'<div class="end"><button class="btn primary big" data-act="ask2">'+(S.cfg.mode==="exam"?"Submit exam":"Finish")+'</button><p>Each answer is locked once you choose it.</p></div>';
  app.innerHTML=(S.done?resultHTML():barHTML())+'<div class="list" id="list" data-filter="'+(S.filter||"all")+'">'+list+'</div>'+end;
  if(!S.done){updateProgress();updateClock();}
}

function updateProgress(){
  var pc=document.getElementById("pc"),fill=document.getElementById("fill");
  if(pc)pc.textContent=answered();
  if(fill)fill.style.width=(answered()/S.ids.length*100)+"%";
}
function updateClock(){
  var c=document.getElementById("clock");
  if(!c||!S)return;
  if(S.cfg.limit){
    var left=S.cfg.limit*60-S.elapsed;
    c.textContent=fmt(left);
    c.classList.toggle("low",left<=300);
  }else c.textContent=fmt(S.elapsed);
}
function tick(){
  if(!S||S.done)return;
  S.elapsed=Math.floor((Date.now()-S.t0)/1000);
  updateClock();
  if(S.cfg.limit&&S.elapsed>=S.cfg.limit*60){finish();return;}
  if(S.elapsed%5===0)save();
}
function startTimer(){
  S.t0=Date.now()-S.elapsed*1000;
  clearInterval(timer);
  timer=setInterval(tick,1000);
  tick();
}

function startFromSetup(){
  var pool=Q.filter(function(q){return cfg.subs.indexOf(q.s)>-1;}).map(function(q){return q.n;});
  if(cfg.shuffle)pool=shuffle(pool);
  if(cfg.count!=="all")pool=pool.slice(0,+cfg.count);
  S={cfg:{mode:cfg.mode,limit:cfg.limit,shuffle:cfg.shuffle},ids:pool,ans:{},done:false,filter:"all",elapsed:0};
  save();renderExam();startTimer();window.scrollTo(0,0);
}

function finish(){
  if(!S||S.done)return;
  S.done=true;S.filter="all";
  clearInterval(timer);save();record();
  renderExam();window.scrollTo(0,0);
}

function firstUnanswered(){
  for(var i=0;i<S.ids.length;i++)if(S.ans[S.ids[i]]==null)return S.ids[i];
  return null;
}
function openAsk(){
  var left=S.ids.length-answered();
  var bar=document.getElementById("ask");
  if(!bar){
    window.scrollTo(0,0);
    bar=document.getElementById("ask");
  }
  document.getElementById("askmsg").textContent=left?left+" of "+S.ids.length+" questions are still unanswered. Unanswered questions count as wrong.":"All "+S.ids.length+" questions are answered.";
  bar.hidden=false;
  if(window.scrollY>40)window.scrollTo({top:0,behavior:reduced()?"auto":"smooth"});
}

/* ---------- Events ---------- */
app.addEventListener("click",function(e){
  var t=e.target.closest("button");
  if(!t)return;
  var d=t.dataset;

  if(d.mode){cfg.mode=d.mode;renderSetup();return;}
  if(d.sub){
    var i=cfg.subs.indexOf(d.sub);
    if(i>-1)cfg.subs.splice(i,1);else cfg.subs.push(d.sub);
    if(cfg.count!=="all"&&+cfg.count>availCount())cfg.count="all";
    renderSetup();return;
  }
  if(d.count){cfg.count=d.count;renderSetup();return;}
  if(d.order){cfg.shuffle=d.order==="rand";renderSetup();return;}
  if(d.filter){S.filter=d.filter;save();renderExam();return;}

  switch(d.act){
    case "allsubs":cfg.subs=Object.keys(SUBJ);renderSetup();break;
    case "nosubs":cfg.subs=[];cfg.count="all";renderSetup();break;
    case "start":
      if(!NAME.trim()){var ne=document.getElementById("nameerr"),ni=document.getElementById("pname");if(ne)ne.textContent="Please write your name to start.";if(ni)ni.focus();break;}
      startFromSetup();break;
    case "resume":renderExam();if(!S.done)startTimer();break;
    case "reopen":renderExam();window.scrollTo(0,0);break;
    case "discard":S=null;wipe();renderSetup();break;
    case "ask":case "ask2":openAsk();break;
    case "cancel":document.getElementById("ask").hidden=true;break;
    case "submit":finish();break;
    case "next":
      var n=firstUnanswered();
      document.getElementById("ask").hidden=true;
      if(n){var el=document.getElementById("q"+n);if(el)el.scrollIntoView({block:"center",behavior:reduced()?"auto":"smooth"});}
      break;
    case "clear":
      break;
    case "retake":
      var st=S.ids.filter(function(n){return S.ans[n]!==byN[n].a;});
      var ids=S.cfg.shuffle?shuffle(st):st;
      var c=S.cfg;
      S={cfg:c,ids:ids,ans:{},done:false,filter:"all",elapsed:0};
      save();renderExam();startTimer();window.scrollTo(0,0);break;
    case "newexam":S=null;wipe();renderSetup();window.scrollTo(0,0);break;
  }
});

app.addEventListener("change",function(e){
  var el=e.target;
  if(el.id==="limit"){cfg.limit=+el.value;return;}
  if(el.type!=="radio"||!S||S.done)return;
  var art=el.closest(".q"),n=+art.dataset.n;
  if(revealed(n))return;
  if(S.ans[n]!=null){art.outerHTML=cardHTML(n,S.ids.indexOf(n));return;}
  S.ans[n]=+el.value;
  save();
  if(S.cfg.mode==="practice"){
    art.outerHTML=cardHTML(n,S.ids.indexOf(n));
  }else{
    var labels=art.querySelectorAll(".opt");
    for(var k=0;k<labels.length;k++)labels[k].classList.toggle("sel",k===S.ans[n]);
    var ins=art.querySelectorAll("input");for(var j=0;j<ins.length;j++)ins[j].disabled=true;
  }
  updateProgress();
});

/* ---------- Name, saved results, hidden results page (#results) ---------- */
var NKEY="nmle-name-v1",RKEY="nmle-results-v1",SHEET_URL="https://script.google.com/macros/s/AKfycbz2i1CkyG6v8lj11eO1w6ibmr-5vb1uom7f__IM8CvRJyuZnwLXkQP5C1Sdc7GXbHzk/exec";
var NAME="";try{NAME=localStorage.getItem(NKEY)||"";}catch(e){}
function rows(){try{return JSON.parse(localStorage.getItem(RKEY))||[];}catch(e){return [];}}
function record(){
  var st=stats(),row={name:NAME.trim(),score:st.r,total:st.total,wrong:st.w,skipped:st.k,pct:Math.round(st.r/st.total*100),mode:S.cfg.mode,seconds:S.elapsed,date:new Date().toISOString()};
  try{var a=rows();a.push(row);localStorage.setItem(RKEY,JSON.stringify(a));}catch(e){}
  if(SHEET_URL){try{fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(row)});}catch(e){}}
}
app.addEventListener("input",function(e){
  if(e.target.id!=="pname")return;
  NAME=e.target.value;try{localStorage.setItem(NKEY,NAME);}catch(x){}
  var ne=document.getElementById("nameerr");if(ne&&NAME.trim())ne.textContent="";
});
function showResults(){
  var r=rows().sort(function(a,b){return b.pct-a.pct||(a.date<b.date?1:-1);});
  var body=r.length?r.map(function(x,i){return '<tr><td>'+(i+1)+'</td><td>'+esc(x.name)+'</td><td>'+x.score+'/'+x.total+'</td><td>'+x.pct+'%</td><td>'+esc(x.mode)+'</td><td>'+esc(new Date(x.date).toLocaleString())+'</td></tr>';}).join(""):'<tr><td colspan="6">No results yet.</td></tr>';
  var o=document.getElementById("resview");if(o)o.remove();
  o=document.createElement("div");o.id="resview";
  o.style.cssText="position:fixed;inset:0;z-index:10000;padding:24px 16px;background:var(--bg);overflow:auto;font-family:var(--f-ui);color:var(--ink)";
  o.innerHTML='<div style="width:100%;max-width:860px;margin:0 auto"><div style="display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px"><h2 style="margin:0;font-size:20px">Saved results</h2><span><button class="btn" id="rvcsv">Export CSV</button> <button class="btn primary" id="rvx">Close</button></span></div>'+
    '<p style="color:var(--muted);margin:0 0 10px">Stored in this browser only.</p><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;text-align:left"><thead><tr><th>#</th><th>Name</th><th>Score</th><th>%</th><th>Mode</th><th>Date</th></tr></thead><tbody>'+body+'</tbody></table></div></div>';
  document.body.appendChild(o);
  o.querySelector("#rvx").onclick=function(){o.remove();if(location.hash==="#results")history.replaceState(null,"",location.pathname+location.search);};
  o.querySelector("#rvcsv").onclick=function(){
    var c="Name,Score,Total,Percent,Mode,Date\n"+rows().map(function(x){return ['"'+String(x.name).replace(/"/g,'""')+'"',x.score,x.total,x.pct,x.mode,x.date].join(",");}).join("\n");
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+c],{type:"text/csv"}));a.download="nmle-results.csv";a.click();};
}
window.addEventListener("hashchange",function(){if(location.hash==="#results")showResults();});

/* ---------- Boot ---------- */
S=load();
if(S&&(!S.ids||!S.ids.length||S.ids.some(function(n){return !byN[n];})))S=null;
renderSetup();
if(location.hash==="#results")showResults();
})();
</script>
